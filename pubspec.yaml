name: unbound_mobile
description: Unbound consumer app (Testnet only). Domain/flows are pure Dart; UI is Flutter.
version: 0.1.0+1
publish_to: none
environment:
  sdk: ^3.13.0
dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.5.0
  flutter_secure_storage: ^11.2.0
  go_router: ^18.1.2
  local_auth: ^3.0.2
  path_provider: ^2.1.6
  stellar_flutter_sdk: ^3.10.0
  crypto: ^3.0.6
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  test: ^1.25.0
  flutter_launcher_icons: ^0.14.4
flutter:
  uses-material-design: true

# Launcher icons are generated from the approved brand art (brand/icon.svg, brand/mark.svg rendered to
# assets/branding/). Regenerate with: dart run flutter_launcher_icons
flutter_launcher_icons:
  android: launcher_icon
  ios: true
  image_path: assets/branding/app_icon.png
  adaptive_icon_background: "#10092E"
  adaptive_icon_foreground: assets/branding/app_icon_foreground.png
  remove_alpha_ios: true
  min_sdk_android: 21
